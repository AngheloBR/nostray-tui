[package]
name = "nostray-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AngheloBR/nostray-tui"
readme = "README.md"
description = "Pomodoro TUI for focused work: sessions, categories, daily goal, streaks and a GitHub-style heatmap"
keywords = ["pomodoro", "tui", "productivity", "focus", "timer"]
categories = ["command-line-utilities"]

[[bin]]
name = "nostray"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
# Sin panic = "abort": el unwind debe correr para restaurar la terminal.

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
directories = "6.0.0"
jiff = { version = "1.0.3", features = ["serde"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
thiserror = "2.0.21"
toml = "1.2.3"
