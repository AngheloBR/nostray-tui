name: Release

# Publica binarios estáticos (musl), paquetes .deb/.rpm y el crate al empujar un tag `v*`,
# p. ej. `git tag -a v0.1.1 -m "..." && git push origin v0.1.1`.
# Lanzado a mano (workflow_dispatch) solo compila y deja los artefactos: no publica.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release
      - name: Empaquetar
        run: |
          name=nostray-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/nostray README.md README.es.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Paquetes .deb y .rpm
        run: |
          # --no-strip: el perfil release ya quita los símbolos (y strip del host no sirve para aarch64).
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output .
          cargo generate-rpm --target ${{ matrix.target }} --output .
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
      - name: Inspeccionar paquetes
        run: |
          for f in *.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done
          for f in *.rpm; do rpm -qip "$f" 2>/dev/null || true; rpm -qlp "$f" 2>/dev/null || true; rpm -qRp "$f" 2>/dev/null || true; done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            nostray-*.tar.gz*
            *.deb*
            *.rpm*

  # Instala los paquetes de verdad antes de publicar: si apt o dnf los rechazan, no hay release.
  # Todo en contenedores; aarch64 se emula con QEMU, así se prueba sin tener un equipo ARM.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            deb: amd64
            rpm: x86_64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            deb: arm64
            rpm: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
      - name: Binario del tarball (Ubuntu)
        run: |
          tar xzf nostray-${{ matrix.target }}.tar.gz
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/pkg:ro" ubuntu:24.04 \
            sh -c 'uname -m && /pkg/nostray-${{ matrix.target }}/nostray --version'
      - name: .deb con apt (Ubuntu)
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/pkg:ro" ubuntu:24.04 \
            sh -c 'apt-get update -qq && apt-get install -y /pkg/nostray-tui_*_${{ matrix.deb }}.deb && nostray --version && dpkg -s nostray-tui | grep -E "^(Package|Version|Architecture)"'
      - name: .rpm con dnf (Fedora)
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/pkg:ro" fedora:latest \
            sh -c 'dnf install -y /pkg/nostray-tui-*.${{ matrix.rpm }}.rpm && nostray --version && rpm -q nostray-tui'

  release:
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            nostray-*.tar.gz*
            *.deb*
            *.rpm*
          generate_release_notes: true

  # Publica el crate en crates.io con Trusted Publishing: GitHub pide un token temporal
  # (OIDC) solo para este job; no hay ningún token guardado en el repo.
  crates-io:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
